name: Deploy GitHub Pages

on:
  # Automatically deploy whenever something is pushed to main
  push:
    branches:
      - main

  # Allow the workflow to be started manually from GitHub Actions
  workflow_dispatch:

# Permissions required by GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent multiple Pages deployments from running at the same time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  #---------------------------------------------------------------------------------------------------------------#
  # Build the Jekyll site
  #---------------------------------------------------------------------------------------------------------------#
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site


  #---------------------------------------------------------------------------------------------------------------#
  # Deploy the generated site to GitHub Pages
  #---------------------------------------------------------------------------------------------------------------#
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs:
      - build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

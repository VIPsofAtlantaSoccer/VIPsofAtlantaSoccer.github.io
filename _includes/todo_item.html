<tr>
    <td></td>
    <td>{{ include.item }}</td>
    <td>
        {% assign Status_List = include.statuses | default: "" | split: "," %}
        {% for Status in Status_List %}
            {% assign Status = Status | strip %}
            {% if Status != "" %}
                {% include Icon_Library.html Icon_Name=Status Icon_Size="Small" %}
            {% endif %}
        {% endfor %}
    </td>
    <td>{{ include.notes }}</td>
</tr>
